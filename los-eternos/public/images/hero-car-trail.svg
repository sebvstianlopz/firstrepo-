<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1400 -100 1700 867" preserveAspectRatio="none">
  <style>
    path { fill: none; stroke-linecap: round; }
    .faint { opacity: .45; }
    /* Glow built from wide, faint strokes instead of blur filters: cheap to animate. */
    .halo { stroke: #e0301e; stroke-width: 44; stroke-opacity: .06; }
    .glow { stroke: #ff3b24; stroke-width: 15; stroke-opacity: .2; }
    .body { stroke: #ff5a45; stroke-width: 4.5; stroke-opacity: .95; }
    .core { stroke: #fff1ea; stroke-width: 1.7; }
    /* Bright pulses racing back along each strand, each at its own pace. */
    .pulse {
      stroke: #fff; stroke-width: 3.2;
      stroke-dasharray: 55 345;
      animation: race calc(1.1s + var(--i) * 0.07s) linear infinite;
      animation-delay: calc(var(--i) * -0.23s);
    }
    @keyframes race { to { stroke-dashoffset: -400; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <defs>
    <!-- Full strength at the car, fading out along the trail. -->
    <linearGradient id="reach" gradientUnits="userSpaceOnUse" x1="-1400" y1="0" x2="220" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".25" stop-color="#4a4a4a"/>
      <stop offset=".62" stop-color="#fff"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="-1400" y="-100" width="1700" height="867">
      <rect x="-1400" y="-100" width="1700" height="867" fill="url(#reach)"/>
    </mask>
  </defs>
