<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 667">
  <style>
    .breathe { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .sweep { animation: sweep 1.9s cubic-bezier(.55,0,.45,1) infinite; }
    @keyframes sweep { from { transform: translateY(-140px); } to { transform: translateY(420px); } }
    @media (prefers-reduced-motion: reduce) { .breathe, .sweep { animation: none; } }
  </style>
  <defs>
    <filter id="glow" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="tight" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bar" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="667">
      <path d="M248 106 L213 152 L186 192 L170 245 L164 300 L160 352" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g class="breathe">
    <path d="M248 106 L213 152 L186 192 L170 245 L164 300 L160 352" fill="none" stroke="#ff3b24" stroke-width="30" stroke-linecap="round" filter="url(#glow)" opacity=".75"/>
    <ellipse cx="132" cy="425" rx="22" ry="12" fill="#ff3b24" filter="url(#glow)" opacity=".5"/>
  </g>
  <g mask="url(#bar)" filter="url(#tight)">
    <rect class="sweep" x="100" y="40" width="200" height="110" fill="url(#band)" opacity=".85"/>
  </g>
</svg>
