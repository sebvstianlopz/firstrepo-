<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" role="img" aria-label="Luxury SUV">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset=".32" stop-color="#141518"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1f23"/>
      <stop offset=".55" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#2a1210"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a45" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#ff5a45" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb4a6"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0301e" stop-opacity="0"/>
      <stop offset=".7" stop-color="#e0301e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff5a45" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="haze" cx="1" cy=".5" r="1" gradientTransform="translate(0 .5) scale(1 .5) translate(0 -.5)">
      <stop offset="0" stop-color="#e0301e" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#e0301e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e0301e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="spin"><feGaussianBlur stdDeviation="1.6"/></filter>
    <g id="wheel">
      <circle r="74" fill="#060607"/>
      <circle r="70" fill="none" stroke="#1b1c1f" stroke-width="5"/>
      <circle r="54" fill="#101114" stroke="#3d3e43" stroke-width="2.5"/>
      <g filter="url(#spin)" stroke="#55565c" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-12" x2="0" y2="-50"/><line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(36)"/>
        <line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(72)"/><line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(108)"/>
        <line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(144)"/><line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(180)"/>
        <line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(216)"/><line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(252)"/>
        <line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(288)"/><line x1="0" y1="-12" x2="0" y2="-50" transform="rotate(324)"/>
      </g>
      <path d="M-30,-26 A40,40 0 0 1 -6,-39" stroke="#c4231a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle r="11" fill="#1a1b1e" stroke="#6a6b70" stroke-width="1.5"/>
      <path d="M-62,-30 A68,68 0 0 1 30,-62" stroke="#ff5a45" stroke-opacity=".35" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <!-- Light trail behind the car -->
  <rect x="0" y="80" width="430" height="240" fill="url(#haze)"/>
  <rect x="40" y="168" width="380" height="5" rx="2.5" fill="url(#trail)" filter="url(#soft)"/>
  <rect x="120" y="186" width="300" height="2" rx="1" fill="url(#trail)"/>
  <rect x="0" y="240" width="420" height="2" rx="1" fill="url(#trail)" opacity=".5"/>
  <rect x="200" y="300" width="220" height="3" rx="1.5" fill="url(#trail)" opacity=".6" filter="url(#soft)"/>

  <ellipse cx="880" cy="368" rx="520" ry="20" fill="url(#shadow)"/>

  <g transform="translate(380 6)">
    <!-- Body -->
    <path d="M30,270 L28,175 Q30,140 60,132 L88,92 Q96,80 116,79 L590,76 Q614,76 630,90 L712,158 L900,172 Q948,178 962,205 L968,262 Q968,276 952,280 L868,282 A96,96 0 0 0 678,282 L322,282 A96,96 0 0 0 132,282 L48,282 Q30,280 30,270 Z" fill="url(#body)"/>
    <!-- Windows -->
    <path d="M118,152 L138,100 Q144,91 158,91 L584,89 Q600,89 611,99 L684,156 Z" fill="url(#glass)"/>
    <rect x="330" y="88" width="15" height="70" fill="#141518"/>
    <rect x="520" y="88" width="13" height="70" fill="#141518"/>
    <path d="M150,104 L560,100" stroke="#ff5a45" stroke-opacity=".18" stroke-width="10" filter="url(#soft)"/>
    <!-- Lines and details -->
    <path d="M40,186 L955,196" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
    <path d="M345,160 L345,272 M533,160 L533,272" stroke="#000" stroke-opacity=".55" stroke-width="2"/>
    <path d="M60,248 L960,252" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
    <rect x="404" y="204" width="34" height="5" rx="2.5" fill="#3b3c41"/>
    <rect x="590" y="206" width="34" height="5" rx="2.5" fill="#3b3c41"/>
    <path d="M626,150 L664,146 L668,163 L630,166 Z" fill="#0a0a0b" stroke="#ff5a45" stroke-opacity=".5" stroke-width="1.5"/>
    <!-- Rim light along the roof and hood -->
    <path d="M60,132 L88,92 Q96,80 116,79 L590,76 Q614,76 630,90 L712,158 L900,172 Q948,178 962,205" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#glow)" opacity=".8"/>
    <path d="M60,132 L88,92 Q96,80 116,79 L590,76 Q614,76 630,90 L712,158 L900,172 Q948,178 962,205" fill="none" stroke="url(#rim)" stroke-width="2.2"/>
    <!-- Lights -->
    <path d="M884,186 L958,195 L955,203 L882,194 Z" fill="#fff" filter="url(#glow)"/>
    <path d="M884,186 L958,195 L955,203 L882,194 Z" fill="#f4f7ff"/>
    <rect x="956" y="206" width="6" height="44" rx="3" fill="#fff" filter="url(#glow)"/>
    <rect x="956" y="206" width="6" height="44" rx="3" fill="#f4f7ff"/>
    <rect x="26" y="140" width="9" height="74" rx="3" fill="#ff2a17" filter="url(#glow)"/>
    <rect x="26" y="140" width="9" height="74" rx="3" fill="#ff4a33"/>
    <!-- Wheels -->
    <use href="#wheel" x="227" y="286"/>
    <use href="#wheel" x="773" y="286"/>
  </g>
</svg>
